name: openhwfp-eval

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: SBT test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: sbt

      - name: Set up SBT
        uses: sbt/setup-sbt@v1

      - name: Cache Verilator
        id: cache-verilator
        uses: actions/cache@v4
        with:
          path: ~/verilator-5.044
          key: verilator-5.044-${{ runner.os }}
          
      - name: Build Verilator 5.044
        if: steps.cache-verilator.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y git autoconf automake libtool make g++ flex bison libfl-dev zlib1g-dev help2man
          git clone https://github.com/verilator/verilator.git
          cd verilator
          git checkout tags/v5.044 -b v5.044build
          autoconf
          ./configure --prefix=$HOME/verilator-5.044
          make -j"$(nproc)"
          make install

      - name: Add Verilator to PATH
        run: echo "$HOME/verilator-5.044/bin" >> "$GITHUB_PATH"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Python requirements
        run: make setup

      - name: Run unit tests, YAML schema, and descriptor vs. lockfile checks
        run: make selftest

      - name: Elaborate RTL
        run: make rtl

      - name: Run RTL vs. lockfile checks
        run: make locks-check
