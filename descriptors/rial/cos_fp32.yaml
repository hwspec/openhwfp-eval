library: rial
operator: cos
stem: RialCosFP32
module: MathFunctions
tier: 2
format:
  name: fp32
  exp_bits: 8
  sig_bits: 24
  subnormals: true
generator:
  factory: rial.mathfunc
  params:
    spec: FP32
    func: Cos
    nOrder: 3
    adrW: 8
    extraBits: 0
sim:
  protocol: combinational
  clock: clock
  reset: reset
  reset_active: high
  reset_cycles: 10
ports:
  a:
    chisel: io.x
    dir: in
    width: 32
  result:
    chisel: io.z
    dir: out
    width: 32
  select:
    chisel: io.sel
    dir: in
    width: 2
    constant: 2
ignore_ports: []
profile:
  rounding_modes:
  - rne
  rounding_control: elaboration
  exception_flags: none
  subnormals: flushed
  nan_payload: ignored
  signed_zero: ignored
  not_evaluated_reason: RoundSpec is a constructor argument, so other modes need separate DUTs. RealSpec
    sets disableSubnormal=true for every Rial format, so subnormal operands and results are outside the
    design's scope.
stimulus:
  reference: mpfr
  seed: 1
  count: 20000
notes: io_sel is resolved by the generator from MathFuncConfig; see manifest constants.
